RewriteEngine on

# Enable globally here or per OPAC virtual host. See docs/antibot.md for keys.
# SetEnvIf Request_URI ^ ANTIBOT_ENABLED=1
# Optionally protect all browser routes, retaining the machine exclusions below:
# SetEnvIf Request_URI ^ ANTIBOT_ALL=1

# Optional policy parameters are arguments in this same Apache configuration.
# Difficulty is in leading zero bits; both lifetimes are in seconds.
# No Koha worker, session or database is used by this persistent verifier.
RewriteMap koha_antibot "prg:/usr/sbin/koha-opac-pow --difficulty 16 --challenge-ttl 120 --clearance-ttl 3600" www-data:www-data

RewriteCond %{ENV:ANTIBOT_ENABLED} ^(1|Y|Yes)$
RewriteRule ^ - [E=ANTIBOT_ACTIVE:1]

# These errors must not be internally redirected to a Koha error page.
<If "reqenv('ANTIBOT_ENABLED') =~ /^(1|Y|Yes)$/">
    ErrorDocument 429 "Browser verification is required. Open the OPAC before retrying the form."
    ErrorDocument 503 "Browser verification is temporarily unavailable."
</If>

# Issue a challenge as a header, without a CGI or a cacheable response.
RewriteCond %{ENV:ANTIBOT_ACTIVE} =1
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/(issue|solve)$ - [E=ANTIBOT_ENDPOINT:1]
RewriteCond %{ENV:ANTIBOT_ENDPOINT} =1
RewriteCond %{REQUEST_METHOD} =GET
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/issue$ - [E=ANTIBOT_CHALLENGE:${koha_antibot:issue!%{REMOTE_ADDR}!${instance}}]
RewriteCond %{ENV:ANTIBOT_CHALLENGE} ^q1\.
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/issue$ - [R=204,END]

# Cheap date/shape checks precede the authenticated challenge and PoW check.
RewriteCond %{ENV:ANTIBOT_ENDPOINT} =1
RewriteCond %{REQUEST_METHOD} =POST
RewriteCond %{HTTP:X-Koha-Proof} ^(0|[1-9][0-9]{0,9})$
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/solve$ - [E=ANTIBOT_PROOF:%1]
RewriteCond %{ENV:ANTIBOT_PROOF} !^$
RewriteCond "%{TIME_YEAR}%{TIME_MON}%{TIME_DAY}#%{HTTP:X-Koha-Challenge}" "^([0-9]{8})#(q1\.\1\.[0-9]{10}\.[0-9]{2}\.[0-9a-f]{32}\.[0-9a-f]{16}\.[0-9a-f]{64})$"
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/solve$ - [E=ANTIBOT_CHALLENGE:%2]
RewriteCond %{ENV:ANTIBOT_PROOF} !^$
RewriteCond %{ENV:ANTIBOT_CHALLENGE} ^q1\.
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/solve$ - [E=ANTIBOT_CLEARANCE:${koha_antibot:solve!%{REMOTE_ADDR}!${instance}!%{ENV:ANTIBOT_CHALLENGE}!%{ENV:ANTIBOT_PROOF}}]
RewriteCond %{ENV:ANTIBOT_CLEARANCE} ^c1\.
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/solve$ - [E=ANTIBOT_SOLVED:1]
RewriteCond %{ENV:ANTIBOT_SOLVED} =1
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/solve$ - [R=204,END]
RewriteCond %{ENV:ANTIBOT_ENDPOINT} =1
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/solve$ - [R=429,END]
RewriteCond %{ENV:ANTIBOT_ENDPOINT} =1
RewriteRule ^/opac-tmpl/lib/koha_fast_challenge/issue$ - [R=503,END]

Header always set Cache-Control "no-store, private" env=ANTIBOT_ENDPOINT
Header always set X-Koha-Challenge "%{ANTIBOT_CHALLENGE}e" env=ANTIBOT_ENDPOINT
Header always set Set-Cookie "KOHA_INIT=%{ANTIBOT_CLEARANCE}e; Path=/; Secure; HttpOnly; SameSite=Lax" env=ANTIBOT_SOLVED

# Public machine interfaces do not run JavaScript. They still need their own
# authentication/rate limiting; the challenge is not an application firewall.
# Only the search controller produces RSS. Do not let a format parameter on
# another page, a duplicate parameter, or an encoded name bypass its gate.
RewriteCond %{ENV:ANTIBOT_ACTIVE} =1
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{REQUEST_URI} ^/(cgi-bin/koha/opac-search\.pl|opac-search\.pl|search)$
RewriteCond %{QUERY_STRING} (^|&)format=rss2?(&|$)
RewriteCond %{QUERY_STRING} !(^|&)format=[^&]*&(?:[^&]*&)*format=
RewriteCond %{QUERY_STRING} !(^|&)[^=&]*%[^=&]*=
RewriteCond %{QUERY_STRING} !;
RewriteRule ^ - [E=ANTIBOT_RSS:1]

RewriteCond %{ENV:ANTIBOT_ACTIVE} =1
RewriteCond %{REQUEST_URI} !^/(opac-tmpl/|api/|\.well-known/|robots\.txt$|favicon\.ico$|sitemap|cgi-bin/koha/(ilsdi|unapi)\.pl)
RewriteCond %{ENV:ANTIBOT_RSS} !=1
RewriteCond %{ENV:ANTIBOT_ALL} ^(1|Y|Yes)$ [OR]
RewriteCond expr "%{REQUEST_URI} =~ m#^/(cgi-bin/koha/(opac-detail|opac-export|opac-suggestions|opac-search|opac-authoritiesdetail|opac-ISBDdetail|opac-MARCdetail|opac-shelves)\.pl(/.*)?|search(/.*)?|opac-search\.pl(/.*)?|index\.html|)$#"
RewriteRule ^ - [E=ANTIBOT_PROTECTED:1]

# Duplicate clearance cookies are ambiguous, even if one is valid.
RewriteCond %{ENV:ANTIBOT_PROTECTED} =1
RewriteCond %{HTTP:Cookie} "(^|;[ \t]*)KOHA_INIT=[^;]*;(?:[^;]*;)*[ \t]*KOHA_INIT="
RewriteRule ^ - [E=ANTIBOT_BAD_COOKIE:1]

# Matching the public date only permits a verifier lookup. A missing, stale,
# oversized or malformed token never calls the verifier.
RewriteCond %{ENV:ANTIBOT_PROTECTED} =1
RewriteCond %{ENV:ANTIBOT_BAD_COOKIE} !=1
RewriteCond "%{TIME_YEAR}%{TIME_MON}%{TIME_DAY}#%{HTTP:Cookie}" "^([0-9]{8})#[ \t]*(?:[^;]*;[ \t]*)*KOHA_INIT=(c1\.\1\.[0-9]{10}\.[0-9]{2}\.[0-9a-f]{32}\.[0-9a-f]{16}\.[0-9a-f]{64})(;|$)"
RewriteRule ^ - [E=ANTIBOT_TOKEN:%2]
RewriteCond %{ENV:ANTIBOT_TOKEN} ^c1\.
RewriteRule ^ - [E=ANTIBOT_VALID:${koha_antibot:verify!%{REMOTE_ADDR}!${instance}!%{ENV:ANTIBOT_TOKEN}}]

RewriteCond %{ENV:ANTIBOT_PROTECTED} =1
RewriteCond %{ENV:ANTIBOT_VALID} !=ok
RewriteRule ^ - [E=ANTIBOT_DENIED:1]
Header always set Cache-Control "no-store, private" "expr=reqenv('ANTIBOT_DENIED') == '1' || reqenv('REDIRECT_ANTIBOT_DENIED') == '1'"

# Never replace or redirect a submitted form with the challenge document.
RewriteCond %{ENV:ANTIBOT_DENIED} =1
RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
RewriteRule ^ - [R=429,END]

RewriteCond %{ENV:ANTIBOT_DENIED} =1
RewriteRule ^ /opac-tmpl/lib/koha_fast_challenge/index.html [L,PT]
